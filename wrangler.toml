name = "fe"
compatibility_date = "2024-01-01"

[env.production]
account_id = ""
compatibility_date = "2024-01-01"

[env.production.build]
command = "npm run build:cloudflare"
cwd = ""
watch_dir = "src"

[env.production.build.upload]
format = "modules"
dir = ".next"
main = "./server.js"
rules = [
  { type = "ESModule", globs = ["**/*.js"] }
]